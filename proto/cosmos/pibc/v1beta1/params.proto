syntax = "proto3";
package cosmos.pibc.v1beta1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/cosmos/cosmos-sdk/x/pibc/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name)      = "cosmos-sdk/x/pibc/Params";
  option (gogoproto.equal) = true;
}