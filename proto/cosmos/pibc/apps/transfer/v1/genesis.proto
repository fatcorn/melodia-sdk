syntax = "proto3";

package cosmos.pibc.apps.transfer.v1;

option go_package = "github.com/cosmos/cosmos-sdk/x/pibc/apps/transfer/types";

import "cosmos/base/v1beta1/coin.proto";
import "cosmos/pibc/apps/transfer/v1/transfer.proto";
import "gogoproto/gogo.proto";

// GenesisState defines the ibc-transfer genesis state
message GenesisState {
  //  repeated DenomTrace denom_traces = 1 [
  //    (gogoproto.castrepeated) = "Traces",
  //    (gogoproto.nullable)     = false,
  //    (gogoproto.moretags)     = "yaml:\"denom_traces\""
  //  ];
  Params params = 1 [(gogoproto.nullable) = false];
  // total_escrowed contains the total amount of tokens escrowed
  // by the transfer module
  repeated cosmos.base.v1beta1.Coin total_escrowed = 2 [
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (gogoproto.nullable)     = false,
    (gogoproto.moretags)     = "yaml:\"total_escrowed\""
  ];
}
